name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify environment and source compilation
        run: |
          python -m pip check
          python -m compileall -q src tests

      - name: Run test suite
        run: python -m pytest

      - name: Exercise CLI version and verdict paths
        shell: bash
        run: |
          chart-contract --version

          claim="$(cat examples/traps/causal_claim_missing_caveat.claim.txt)"
          chart-contract audit spec examples/traps/causal_claim_missing_caveat.vl.json \
            --data examples/traps/causal_claim_missing_caveat.csv \
            --claim "$claim"

          set +e
          chart-contract audit spec examples/traps/too_many_pie_categories.vl.json \
            --data examples/traps/too_many_pie_categories.csv \
            --claim "$(cat examples/traps/too_many_pie_categories.claim.txt)"
          block_code=$?

          chart-contract audit spec examples/traps/causal_claim_missing_caveat.vl.json \
            --data examples/traps/causal_claim_missing_caveat.csv \
            --claim "$claim" \
            --warnings-as-errors
          review_code=$?
          set -e

          test "$block_code" -eq 1
          test "$review_code" -eq 1

          set +e
          transform_output=$(chart-contract audit spec examples/traps/undeclared_filter_transform.vl.json \
            --data examples/traps/undeclared_filter_transform.csv \
            --claim "$(cat examples/traps/undeclared_filter_transform.claim.txt)" 2>&1)
          transform_exit=$?
          set -e
          echo "$transform_output"
          test "$transform_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$transform_output"
          grep -q "transform.inventory" <<<"$transform_output"
          grep -q "transform.declaration" <<<"$transform_output"

          set +e
          coverage_output=$(chart-contract audit spec examples/traps/low_evidence_coverage.vl.json \
            --data examples/traps/low_evidence_coverage.csv \
            --claim "$(cat examples/traps/low_evidence_coverage.claim.txt)" 2>&1)
          coverage_exit=$?
          set -e
          echo "$coverage_output"
          test "$coverage_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$coverage_output"
          grep -q "data.coverage.usable_rows" <<<"$coverage_output"
          grep -q "4 / 10 rows (40.0%)" <<<"$coverage_output"

          set +e
          lineage_output=$(chart-contract audit spec examples/traps/stale_transform_lineage.vl.json \
            --data examples/traps/stale_transform_lineage.csv \
            --claim "$(cat examples/traps/stale_transform_lineage.claim.txt)" 2>&1)
          lineage_exit=$?
          set -e
          echo "$lineage_output"
          test "$lineage_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$lineage_output"
          grep -q "transform.lineage.receipts" <<<"$lineage_output"
          grep -q "changed receipt(s): transform\[0\].filter" <<<"$lineage_output"

          set +e
          rank_output=$(chart-contract audit spec examples/traps/wrong_rank_topn_filter.vl.json \
            --data examples/traps/wrong_rank_topn_filter.csv \
            --claim "$(cat examples/traps/wrong_rank_topn_filter.claim.txt)" 2>&1)
          rank_exit=$?
          set -e
          echo "$rank_output"
          test "$rank_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$rank_output"
          grep -q "contract.rank.truncation" <<<"$rank_output"
          grep -q "top-N category set" <<<"$rank_output"

          set +e
          denominator_output=$(chart-contract audit spec examples/traps/mixed_denominator_basis.vl.json \
            --data examples/traps/mixed_denominator_basis.csv \
            --claim "$(cat examples/traps/mixed_denominator_basis.claim.txt)" 2>&1)
          denominator_exit=$?
          set -e
          echo "$denominator_output"
          test "$denominator_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$denominator_output"
          grep -q "data.ratio.denominator_basis" <<<"$denominator_output"
          grep -q "mixed denominator identities" <<<"$denominator_output"

          set +e
          comparison_output=$(chart-contract audit spec examples/traps/percent_vs_percentage_points.vl.json \
            --data examples/traps/percent_vs_percentage_points.csv \
            --claim "$(cat examples/traps/percent_vs_percentage_points.claim.txt)" 2>&1)
          comparison_exit=$?
          set -e
          echo "$comparison_output"
          test "$comparison_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$comparison_output"
          grep -q "contract.comparison.change" <<<"$comparison_output"
          grep -q "claim.comparison.change_semantics" <<<"$comparison_output"
          grep -q "percent_change" <<<"$comparison_output"
          grep -q "percentage_points" <<<"$comparison_output"

          set +e
          time_output=$(chart-contract audit spec examples/traps/full_month_vs_mtd.vl.json \
            --data examples/traps/full_month_vs_mtd.csv \
            --claim "$(cat examples/traps/full_month_vs_mtd.claim.txt)" 2>&1)
          time_exit=$?
          set -e
          echo "$time_output"
          test "$time_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$time_output"
          grep -q "contract.time_window.period" <<<"$time_output"
          grep -q "data.time_window.completeness" <<<"$time_output"
          grep -q "complete period with one incomplete period" <<<"$time_output"

          set +e
          grain_output=$(chart-contract audit spec examples/traps/join_fanout_grain.vl.json \
            --data examples/traps/join_fanout_grain.csv \
            --claim "$(cat examples/traps/join_fanout_grain.claim.txt)" 2>&1)
          grain_exit=$?
          set -e
          echo "$grain_output"
          test "$grain_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$grain_output"
          grep -q "data.grain.unique" <<<"$grain_output"
          grep -q "duplicate grain keys" <<<"$grain_output"

          set +e
          omitted_output=$(chart-contract audit spec examples/traps/majority_metric_mass_omitted.vl.json \
            --data examples/traps/majority_metric_mass_omitted.csv \
            --claim "$(cat examples/traps/majority_metric_mass_omitted.claim.txt)" \
            --warnings-as-errors 2>&1)
          omitted_exit=$?
          set -e
          echo "$omitted_output"
          test "$omitted_exit" -eq 1
          grep -q "Verdict: REVIEW" <<<"$omitted_output"
          grep -q "data.rank.omitted_metric_mass" <<<"$omitted_output"
          grep -q "58.0%" <<<"$omitted_output"

          set +e
          unit_output=$(chart-contract audit spec examples/traps/mixed_measurement_units.vl.json \
            --data examples/traps/mixed_measurement_units.csv \
            --claim "$(cat examples/traps/mixed_measurement_units.claim.txt)" 2>&1)
          unit_exit=$?
          set -e
          echo "$unit_output"
          test "$unit_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$unit_output"
          grep -q "contract.unit.conversion" <<<"$unit_output"
          grep -q "data.unit.source_basis" <<<"$unit_output"
          grep -q "mixed source units" <<<"$unit_output"

          set +e
          observation_output=$(chart-contract audit spec examples/traps/missing_zero_filled.vl.json \
            --data examples/traps/missing_zero_filled.csv \
            --claim "$(cat examples/traps/missing_zero_filled.claim.txt)" 2>&1)
          observation_exit=$?
          set -e
          echo "$observation_output"
          test "$observation_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$observation_output"
          grep -q "contract.observation.status" <<<"$observation_output"
          grep -q "data.observation.values" <<<"$observation_output"
          grep -q "missing/suppressed values must be null" <<<"$observation_output"

          set +e
          scope_output=$(chart-contract audit spec examples/traps/mixed_analysis_scope.vl.json \
            --data examples/traps/mixed_analysis_scope.csv \
            --claim "$(cat examples/traps/mixed_analysis_scope.claim.txt)" 2>&1)
          scope_exit=$?
          set -e
          echo "$scope_output"
          test "$scope_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$scope_output"
          grep -q "contract.analysis_scope.identity" <<<"$scope_output"
          grep -q "data.analysis_scope.basis" <<<"$scope_output"
          grep -q "mixed analysis scopes" <<<"$scope_output"

          set +e
          population_output=$(chart-contract audit spec examples/traps/convenience_sample_generalized.vl.json \
            --data examples/traps/convenience_sample_generalized.csv \
            --claim "$(cat examples/traps/convenience_sample_generalized.claim.txt)" \
            --warnings-as-errors 2>&1)
          population_exit=$?
          set -e
          echo "$population_output"
          test "$population_exit" -eq 1
          grep -q "Verdict: REVIEW" <<<"$population_output"
          grep -q "contract.population.scope" <<<"$population_output"
          grep -q "claim.population.generalization" <<<"$population_output"
          grep -q "convenience" <<<"$population_output"

          set +e
          uncertainty_output=$(chart-contract audit spec examples/traps/interval_claim_mismatch.vl.json \
            --data examples/traps/interval_claim_mismatch.csv \
            --claim "$(cat examples/traps/interval_claim_mismatch.claim.txt)" 2>&1)
          uncertainty_exit=$?
          set -e
          echo "$uncertainty_output"
          test "$uncertainty_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$uncertainty_output"
          grep -q "contract.uncertainty.interval" <<<"$uncertainty_output"
          grep -q "data.uncertainty.bounds" <<<"$uncertainty_output"
          grep -q "visual.uncertainty.interval" <<<"$uncertainty_output"
          grep -q "claim.uncertainty.semantics" <<<"$uncertainty_output"
          grep -q "credible" <<<"$uncertainty_output"
          grep -q "confidence" <<<"$uncertainty_output"

          set +e
          target_output=$(chart-contract audit spec examples/traps/target_status_claim_mismatch.vl.json \
            --data examples/traps/target_status_claim_mismatch.csv \
            --claim "$(cat examples/traps/target_status_claim_mismatch.claim.txt)" 2>&1)
          target_exit=$?
          set -e
          echo "$target_output"
          test "$target_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$target_output"
          grep -q "contract.metric.target" <<<"$target_output"
          grep -q "data.metric.target_observation" <<<"$target_output"
          grep -q "visual.metric.target" <<<"$target_output"
          grep -q "claim.metric.target_semantics" <<<"$target_output"
          grep -q "missed" <<<"$target_output"

          set +e
          reconciliation_output=$(chart-contract audit spec examples/traps/control_total_gap.vl.json \
            --data examples/traps/control_total_gap.csv \
            --claim "$(cat examples/traps/control_total_gap.claim.txt)" 2>&1)
          reconciliation_exit=$?
          set -e
          echo "$reconciliation_output"
          test "$reconciliation_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$reconciliation_output"
          grep -q "contract.reconciliation.control_total" <<<"$reconciliation_output"
          grep -q "data.reconciliation.components" <<<"$reconciliation_output"
          grep -q "data.reconciliation.total" <<<"$reconciliation_output"
          grep -q "77.1% represented" <<<"$reconciliation_output"
          grep -q "residual=2.7" <<<"$reconciliation_output"

          set +e
          directionality_output=$(chart-contract audit spec examples/traps/lower_is_better_claim_reversed.vl.json \
            --data examples/traps/lower_is_better_claim_reversed.csv \
            --claim "$(cat examples/traps/lower_is_better_claim_reversed.claim.txt)" 2>&1)
          directionality_exit=$?
          set -e
          echo "$directionality_output"
          test "$directionality_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$directionality_output"
          grep -q "contract.metric.directionality" <<<"$directionality_output"
          grep -q "contract.comparison.change" <<<"$directionality_output"
          grep -q "claim.metric.directionality" <<<"$directionality_output"
          grep -q "worsening" <<<"$directionality_output"

          set +e
          metric_definition_output=$(chart-contract audit spec examples/traps/metric_definition_drift.vl.json \
            --data examples/traps/metric_definition_drift.csv \
            --claim "$(cat examples/traps/metric_definition_drift.claim.txt)" 2>&1)
          metric_definition_exit=$?
          set -e
          echo "$metric_definition_output"
          test "$metric_definition_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$metric_definition_output"
          grep -q "data.metric.definition_basis" <<<"$metric_definition_output"
          grep -q "mixed metric versions" <<<"$metric_definition_output"

      - name: Run statistical diagnostic trap checks
        shell: bash
        run: |
          set +e
          qq_output=$(chart-contract audit spec examples/traps/qq_heavy_tails.vl.json \
            --data examples/traps/qq_heavy_tails.csv \
            --claim "$(cat examples/traps/qq_heavy_tails.claim.txt)" \
            --warnings-as-errors 2>&1)
          qq_exit=$?
          set -e
          echo "$qq_output"
          test "$qq_exit" -eq 1
          grep -q "Verdict: REVIEW" <<<"$qq_output"
          grep -q "claim.qq.normality_support" <<<"$qq_output"

          set +e
          qq_line_output=$(chart-contract audit spec examples/traps/qq_missing_reference_line.vl.json \
            --data examples/traps/qq_missing_reference_line.csv \
            --claim "$(cat examples/traps/qq_missing_reference_line.claim.txt)" 2>&1)
          qq_line_exit=$?
          set -e
          echo "$qq_line_output"
          test "$qq_line_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$qq_line_output"
          grep -q "visual.qq.reference_line" <<<"$qq_line_output"

          set +e
          residual_output=$(chart-contract audit spec examples/traps/residual_obvious_pattern.vl.json \
            --data examples/traps/residual_obvious_pattern.csv \
            --claim "$(cat examples/traps/residual_obvious_pattern.claim.txt)" \
            --warnings-as-errors 2>&1)
          residual_exit=$?
          set -e
          echo "$residual_output"
          test "$residual_exit" -eq 1
          grep -q "Verdict: REVIEW" <<<"$residual_output"
          grep -q "claim.residual.pattern_support" <<<"$residual_output"

          set +e
          tiny_output=$(chart-contract audit spec examples/traps/diagnostic_tiny_sample.vl.json \
            --data examples/traps/diagnostic_tiny_sample.csv \
            --claim "$(cat examples/traps/diagnostic_tiny_sample.claim.txt)" 2>&1)
          tiny_exit=$?
          set -e
          echo "$tiny_output"
          test "$tiny_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$tiny_output"
          grep -q "data.residual.sample_size" <<<"$tiny_output"

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install wheel in an isolated environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/*.whl
          .venv-smoke/bin/python -m pip check
          .venv-smoke/bin/chart-contract --version > version.txt
          claim="$(cat examples/traps/causal_claim_missing_caveat.claim.txt)"
          .venv-smoke/bin/chart-contract audit spec examples/traps/causal_claim_missing_caveat.vl.json \
            --data examples/traps/causal_claim_missing_caveat.csv \
            --claim "$claim" \
            --format json > report.json
          .venv-smoke/bin/chart-contract verify report report.json \
            --spec examples/traps/causal_claim_missing_caveat.vl.json \
            --data examples/traps/causal_claim_missing_caveat.csv \
            --claim "$claim" > binding-check.txt

      - name: Verify installed CLI and report shape
        run: |
          .venv-smoke/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          installed_version = version("chart-contract")
          version_output = Path("version.txt").read_text(encoding="utf-8").strip()
          assert version_output == f"chart-contract {installed_version}"

          payload = json.loads(Path("report.json").read_text(encoding="utf-8"))
          assert payload["schema_version"] == "0.4"
          assert payload["verdict"] == "REVIEW"
          assert isinstance(payload["findings"], list)
          assert payload["findings"]

          binding = payload["input_binding"]
          assert binding["algorithm"] == "sha256"
          assert binding["subject_kind"] == "spec"
          assert binding["tool_version"] == installed_version
          assert len(binding["subject_sha256"]) == 64
          assert len(binding["data_sha256"]) == 64
          assert len(binding["claim_sha256"]) == 64
          assert len(binding["bundle_sha256"]) == 64

          report_binding = payload["report_binding"]
          assert report_binding["algorithm"] == "sha256"
          assert report_binding["canonicalization"] == "audit-report-semantics-v1"
          assert report_binding["input_bundle_sha256"] == binding["bundle_sha256"]
          assert report_binding["audit_profile"]["profile"] == "audit-v0.2"
          assert len(report_binding["audit_profile"]["profile_manifest_sha256"]) == 64
          assert len(report_binding["report_sha256"]) == 64

          binding_output = Path("binding-check.txt").read_text(encoding="utf-8")
          assert "Report integrity: MATCH" in binding_output
          assert "Audit profile: MATCH" in binding_output
          assert "Binding: MATCH" in binding_output
          assert "Subject: MATCH" in binding_output
          assert "Data: MATCH" in binding_output
          assert "Claim: MATCH" in binding_output
          PY
