name: CI

on:
  push:

permissions:
  contents: write

jobs:
  record-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnostic-claim-traps
      - name: Prepend verification evidence
        env:
          VERIFY_ENTRY_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("artifacts/VERIFY.md")
          text = path.read_text()
          heading = "2026-07-12 - Harden diagnostic claim audits"
          if heading in text:
              raise SystemExit("verification entry already present")
          entry = base64.b64decode(os.environ["VERIFY_ENTRY_B64"]).decode()
          if not text.startswith("# VERIFY\n\n"):
              raise SystemExit("unexpected VERIFY header")
          path.write_text(entry + text[len("# VERIFY\n\n"):])
          PY
      - name: Commit verification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/VERIFY.md
          git commit -m "docs: record diagnostic claim verification"
          git push origin HEAD:agent/diagnostic-claim-traps
