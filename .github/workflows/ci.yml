name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install dependencies quietly
        run: python -m pip install -q -e ".[dev]"
      - name: Run first failing test
        run: python -m pytest -x -q
