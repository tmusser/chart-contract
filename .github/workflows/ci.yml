name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and run first failing test
        run: |
          git clone -q --depth 1 --branch agent/diagnostic-claim-traps \
            https://github.com/tmusser/chart-contract.git repo
          cd repo
          python -m pip install -q -e ".[dev]"
          python -m pytest -x -q
