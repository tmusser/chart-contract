name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  record-verification:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnostic-claim-traps
      - name: Prepend verification evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/VERIFY.md")
          text = path.read_text()
          heading = "2026-07-12 - Harden diagnostic claim audits"
          if heading in text:
              raise SystemExit("verification entry already present")
          entry = '''# VERIFY

2026-07-12 - Harden diagnostic claim audits

Environment:
- Branch: `agent/diagnostic-claim-traps`
- Pull request: #5 (`feat: harden diagnostic claim audits`)
- Python: 3.12 on GitHub Actions Ubuntu runner

Commands and gates:
- `python -m pytest` -> PASSED (full repository suite)
- legacy CLI REVIEW smoke check -> PASSED
- legacy CLI BLOCK smoke check -> PASSED
- legacy warnings-as-errors smoke check -> PASSED
- `qq_heavy_tails` -> PASSED (`REVIEW`, `claim.qq.normality_support`)
- `qq_missing_reference_line` -> PASSED (`BLOCK`, `visual.qq.reference_line`)
- `residual_obvious_pattern` -> PASSED (`REVIEW`, `claim.residual.pattern_support`)
- `diagnostic_tiny_sample` -> PASSED (`BLOCK`, `data.residual.sample_size`)
- GitHub Actions CI run #155 -> PASSED

Changed areas:
- `src/chart_contract/statistical_audit.py`
- `src/chart_contract/audit.py`
- `src/chart_contract/renderers/altair.py`
- `tests/test_statistical_intents.py`
- `examples/traps/qq_heavy_tails.*`
- `examples/traps/qq_missing_reference_line.*`
- `examples/traps/residual_obvious_pattern.*`
- `examples/traps/diagnostic_tiny_sample.*`
- `examples/traps/README.md`
- `docs/DIAGNOSTIC_CLAIMS.md`
- `docs/AUDIT_RULES.md`
- `README.md`
- `.github/workflows/ci.yml`
- `CHANGELOG.md`
- `artifacts/VERIFY.md`
- `artifacts/HANDOFF.md`

Verified behavior:
- first-party QQ specs require a supported fitted reference line
- severe QQ outer-tail departure warns against overconfident normality wording
- obvious monotonic or broad curved residual structure warns against “no pattern” claims
- fewer than five complete diagnostic observations block interpretation
- nonnumeric fitted values fail without entering residual correlation calculations
- statistical intent metadata is limited to QQ, ECDF, and residual specs, preserving older `usermeta` contracts

Deterministic boundaries:
- QQ tail warning: maximum outer-20% departure at least 0.8 sample standard deviations
- residual warning: absolute fitted/residual correlation at least 0.5 or ordered-thirds mean shift at least 1 residual standard deviation
- diagnostic sample gate: FAIL below 5, WARN for 5-19, PASS at 20+

Remaining risks:
- thresholds catch obvious tail, monotonic, and broad curved structure but do not exhaust heteroskedasticity, autocorrelation, leverage, or every model diagnostic failure
- QQ checks are visual-contract guardrails, not formal normality tests
- first-party statistical spec semantics require `usermeta.chart_contract_intent`

Next safest task:
- Review draft PR #5 and squash-merge if the thresholds and REVIEW-versus-BLOCK split are acceptable.

'''
          if not text.startswith("# VERIFY\n"):
              raise SystemExit("unexpected VERIFY header")
          path.write_text(entry + text[len("# VERIFY\n\n"):])
          PY
      - name: Commit verification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/VERIFY.md
          git commit -m "docs: record diagnostic claim verification"
          git push origin HEAD:agent/diagnostic-claim-traps

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run CLI REVIEW smoke check
        run: |
          claim="$(cat examples/traps/causal_claim_missing_caveat.claim.txt)"
          chart-contract audit spec examples/traps/causal_claim_missing_caveat.vl.json \
            --data examples/traps/causal_claim_missing_caveat.csv \
            --claim "$claim"

      - name: Run CLI BLOCK smoke check
        run: |
          set +e
          claim="$(cat examples/traps/too_many_pie_categories.claim.txt)"
          chart-contract audit spec examples/traps/too_many_pie_categories.vl.json \
            --data examples/traps/too_many_pie_categories.csv \
            --claim "$claim"
          exit_code=$?
          set -e
          test "$exit_code" -eq 1

      - name: Run CLI REVIEW smoke check with warnings as errors
        run: |
          set +e
          claim="$(cat examples/traps/causal_claim_missing_caveat.claim.txt)"
          chart-contract audit spec examples/traps/causal_claim_missing_caveat.vl.json \
            --data examples/traps/causal_claim_missing_caveat.csv \
            --claim "$claim" \
            --warnings-as-errors
          exit_code=$?
          set -e
          test "$exit_code" -ne 0

      - name: Run statistical diagnostic trap checks
        shell: bash
        run: |
          set +e
          qq_output=$(chart-contract audit spec examples/traps/qq_heavy_tails.vl.json \
            --data examples/traps/qq_heavy_tails.csv \
            --claim "$(cat examples/traps/qq_heavy_tails.claim.txt)" \
            --warnings-as-errors 2>&1)
          qq_exit=$?
          set -e
          echo "$qq_output"
          test "$qq_exit" -eq 1
          grep -q "Verdict: REVIEW" <<<"$qq_output"
          grep -q "claim.qq.normality_support" <<<"$qq_output"

          set +e
          qq_line_output=$(chart-contract audit spec examples/traps/qq_missing_reference_line.vl.json \
            --data examples/traps/qq_missing_reference_line.csv \
            --claim "$(cat examples/traps/qq_missing_reference_line.claim.txt)" 2>&1)
          qq_line_exit=$?
          set -e
          echo "$qq_line_output"
          test "$qq_line_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$qq_line_output"
          grep -q "visual.qq.reference_line" <<<"$qq_line_output"

          set +e
          residual_output=$(chart-contract audit spec examples/traps/residual_obvious_pattern.vl.json \
            --data examples/traps/residual_obvious_pattern.csv \
            --claim "$(cat examples/traps/residual_obvious_pattern.claim.txt)" \
            --warnings-as-errors 2>&1)
          residual_exit=$?
          set -e
          echo "$residual_output"
          test "$residual_exit" -eq 1
          grep -q "Verdict: REVIEW" <<<"$residual_output"
          grep -q "claim.residual.pattern_support" <<<"$residual_output"

          set +e
          tiny_output=$(chart-contract audit spec examples/traps/diagnostic_tiny_sample.vl.json \
            --data examples/traps/diagnostic_tiny_sample.csv \
            --claim "$(cat examples/traps/diagnostic_tiny_sample.claim.txt)" 2>&1)
          tiny_exit=$?
          set -e
          echo "$tiny_output"
          test "$tiny_exit" -eq 1
          grep -q "Verdict: BLOCK" <<<"$tiny_output"
          grep -q "data.residual.sample_size" <<<"$tiny_output"
