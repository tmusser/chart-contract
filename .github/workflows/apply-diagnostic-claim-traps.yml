name: Apply diagnostic claim hardening

on:
  push:
    branches:
      - agent/diagnostic-claim-traps
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnostic-claim-traps
      - name: Apply reviewed patch
        run: |
          git apply --recount --check .github/patches/diagnostic-claim-traps.diff
          git apply --recount .github/patches/diagnostic-claim-traps.diff
      - name: Publish implementation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chart_contract/audit.py \
            src/chart_contract/renderers/altair.py \
            README.md
          git commit -m "feat: harden diagnostic claim audits"
          git push origin HEAD:agent/diagnostic-claim-traps
