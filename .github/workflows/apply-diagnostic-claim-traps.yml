name: Apply diagnostic claim hardening

on:
  push:
    branches:
      - agent/diagnostic-claim-traps
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnostic-claim-traps
      - name: Apply reviewed patch
        run: |
          git apply --check .github/patches/diagnostic-claim-traps.diff
          git apply .github/patches/diagnostic-claim-traps.diff
      - name: Replace bootstrap files with implementation commit
        run: |
          rm -rf .github/patches
          rm .github/workflows/apply-diagnostic-claim-traps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden diagnostic claim audits"
          git push origin HEAD:agent/diagnostic-claim-traps
