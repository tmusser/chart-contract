name: Apply statistical diagnostic changes

on:
  push:
    branches:
      - agent/statistical-diagnostic-plots

permissions:
  contents: write

jobs:
  apply-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/statistical-diagnostic-plots
      - name: Apply reviewed patches
        run: |
          git apply --check \
            .github/patches/statistical-intents.diff \
            .github/patches/statistical-docs.diff
          git apply \
            .github/patches/statistical-intents.diff \
            .github/patches/statistical-docs.diff
      - name: Replace bootstrap files with implementation commit
        run: |
          rm -rf .github/patches
          rm .github/workflows/apply-statistical-intents.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add statistical diagnostic plots"
          git push origin HEAD:agent/statistical-diagnostic-plots
