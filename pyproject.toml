[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-contract"
version = "0.1.0"
description = "A lightweight Python harness for claim-first, audited analytical charts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Musser" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "altair>=5.0.0",
  "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/tmusser/chart-contract"
Repository = "https://github.com/tmusser/chart-contract"
Issues = "https://github.com/tmusser/chart-contract/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "vl-convert-python",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
